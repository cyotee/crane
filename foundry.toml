# ---------------------------------------------------------------------------
# Fork profile — only RPC fork tests (**/fork/**).
# ---------------------------------------------------------------------------
[profile.fork]
# Only execute tests under a fork/ directory (top-level or protocol-local).
match_path = "**/fork/**"
# Clear default's no_match so the positive match_path is not also excluded.
no_match_path = ""
