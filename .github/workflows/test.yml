name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Default profile: hermetic compile (skips **/fork/** tests; no RPC).
  # Port-specific profiles were removed; only default + fork remain in foundry.toml.
  FOUNDRY_PROFILE: default
  FOUNDRY_THREADS: "1"

concurrency:
  group: build-default-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Forge build (default profile)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Enable swap (compile is memory-heavy)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.5.1"

      - name: Cache Foundry artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.svm
            cache_forge
            out
          key: foundry-${{ runner.os }}-1.5.1-default-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}
          restore-keys: |
            foundry-${{ runner.os }}-1.5.1-default-
            foundry-${{ runner.os }}-1.5.1-

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        # -j 1 keeps peak memory lower on free GHA runners.
        run: forge build -j 1
